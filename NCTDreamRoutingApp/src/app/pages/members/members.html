<section class="page-shell">
  <header class="page-header">
    <h1>NCT DREAM Members</h1>
    <p>Seven members, each bringing a unique personality and energy.</p>
  </header>

  <div class="member-grid">
    @for (member of members; track member.name) {
      <article class="member-card">
        <div class="member-photo" aria-label="Photo placeholder for {{ member.name }}">
          <span>{{ member.name }}</span>
        </div>
        <div class="member-info">
          <h3>{{ member.name }}</h3>
          <p class="role">{{ member.role }}</p>
          <p>{{ member.info }}</p>
        </div>
      </article>
    }
  </div>
</section>
